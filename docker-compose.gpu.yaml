services:

  eve-embedding:
    container_name: eve-embedding
    hostname: eve-embedding
    image: vllm/vllm-openai
    privileged: true
    ipc: host
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: "1"
      EMBEDDING_MAX_MODEL_LEN: "2048"
      EMBEDDING_GPU_MEMORY_UTILIZATION: "0.12"
      EMBEDDING_CPU_OFFLOAD_GB: "0"
      EMBEDDING_SWAP_SPACE_GB: "4"
      EMBEDDING_KV_CACHE_MEMORY_BYTES: 256M
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  eve-reasoning:
    container_name: eve-reasoning
    hostname: eve-reasoning
    image: vllm/vllm-openai
    privileged: true
    ports:
      - 5014:5014
    volumes:
      - ./models:/models
      - ./compose/reasoning_vllm/entrypoint.sh:/entrypoint.sh
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: "0"
      MODEL_DIR: /models
      REASONING_MODEL: Qwen3-4B-Instruct-2507
      REASONING_PORT: "5014"
      REASONING_HOST: 0.0.0.0
      VLLM_TENSOR_PARALLEL_SIZE: "1"
      VLLM_GPU_MEMORY_UTILIZATION: "0.68"
      VLLM_MAX_MODEL_LEN: "${VLLM_MAX_MODEL_LEN:-8192}"
      VLLM_CPU_OFFLOAD_GB: "0"
      VLLM_SWAP_SPACE_GB: "0"
      VLLM_KV_CACHE_MEMORY_BYTES: 1280M
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: /entrypoint.sh
