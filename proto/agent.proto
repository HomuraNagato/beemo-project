syntax = "proto3";

package eve;

option go_package = "eve-beemo/proto/gen;proto";

// Orchestrator-facing stream of state updates (optional for UI/tests).
service Orchestrator {
  rpc StreamState(StateRequest) returns (stream StateUpdate);
  rpc Chat(ChatRequest) returns (ChatResponse);
  rpc RunAgent(AgentRequest) returns (stream AgentEvent);
  rpc Approve(ApprovalDecision) returns (ApprovalResult);
  rpc ListAgentWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc ListAgentSessions(SessionListRequest) returns (SessionListResponse);
  rpc GetAgentSession(SessionRequest) returns (AgentSessionDetail);
  rpc GetAgentDiff(AgentDiffRequest) returns (AgentDiffResponse);
}

// Host-local repository operations. The service is exposed over a Unix socket
// and is never published as a TCP port.
service CodeTools {
  rpc Health(CodeHealthRequest) returns (CodeHealthResponse);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc Execute(CodeToolRequest) returns (CodeToolResult);
}

service WakeWord {
  rpc StreamWake(WakeRequest) returns (stream WakeDetected);
}

service ASR {
  // Client streams audio chunks; server streams transcripts.
  rpc StreamTranscribe(stream AudioChunk) returns (stream TranscribeResult);
}

service LLM {
  rpc Chat(ChatRequest) returns (stream ChatChunk);
}

service TTS {
  rpc Speak(SpeakRequest) returns (stream AudioChunk);
}

service Vision {
  rpc Capture(CaptureRequest) returns (CaptureResult);
}

service Tools {
  rpc Execute(ToolRequest) returns (ToolResult);
}

message StateRequest {
  string session_id = 1;
}

message StateUpdate {
  string session_id = 1;
  string state = 2;
  string message = 3;
  int64 timestamp_unix_ms = 4;
}

message WakeRequest {
  string session_id = 1;
}

message WakeDetected {
  string session_id = 1;
  int64 timestamp_unix_ms = 2;
  string source = 3;
  string transcript = 4;
  string prompt = 5;
  string response = 6;
  float confidence = 7;
  repeated string tools = 8;
  string status = 9;
  string error_kind = 10;
}

message AudioChunk {
  bytes pcm_s16le = 1;
  int32 sample_rate_hz = 2;
}

message TranscribeResult {
  string text = 1;
  float confidence = 2;
  bool is_final = 3;
}

message ChatMessage {
  string role = 1; // system | user | assistant
  string content = 2;
}

message ChatRequest {
  string session_id = 1;
  repeated ChatMessage messages = 2;
  repeated string image_paths = 3;
  map<string, string> options = 4;
}

message ChatChunk {
  string text = 1;
  bool is_final = 2;
}

message ChatResponse {
  string text = 1;
  repeated string tools = 2;
  string status = 3;
  string error_kind = 4;
}

message AgentRequest {
  string session_id = 1;
  repeated ChatMessage messages = 2;
  string mode = 3; // chat | code
  string workspace = 4;
  map<string, string> options = 5;
}

message AgentEvent {
  string session_id = 1;
  string type = 2; // status | assistant | tool_start | tool_result | approval | file_change | complete | error
  string text = 3;
  string tool = 4;
  string payload_json = 5;
  int64 timestamp_unix_ms = 6;
  string approval_id = 7;
}

message ApprovalDecision {
  string session_id = 1;
  string approval_id = 2;
  bool approved = 3;
}

message ApprovalResult {
  bool accepted = 1;
  string status = 2;
}

message CodeHealthRequest {}

message CodeHealthResponse {
  bool ready = 1;
  string version = 2;
}

message ListWorkspacesRequest {}

message ListWorkspacesResponse {
  repeated string roots = 1;
}

message CodeToolRequest {
  string session_id = 1;
  string workspace = 2;
  string action = 3;
  string args_json = 4;
  bool approved = 5;
}

message CodeToolResult {
  string action = 1;
  string output = 2;
  string status = 3; // ok | approval_required | error
  string error = 4;
  string approval_id = 5;
  bool changed = 6;
}

message SessionListRequest {
  int32 limit = 1;
}

message AgentSessionSummary {
  string session_id = 1;
  string mode = 2;
  string workspace = 3;
  string status = 4;
  int64 updated_unix_ms = 5;
}

message SessionListResponse {
  repeated AgentSessionSummary sessions = 1;
}

message SessionRequest {
  string session_id = 1;
}

message AgentSessionDetail {
  AgentSessionSummary session = 1;
  repeated AgentEvent events = 2;
}

message AgentDiffRequest {
  string session_id = 1;
  string workspace = 2;
}

message AgentDiffResponse {
  string diff = 1;
  string error = 2;
}

message SpeakRequest {
  string session_id = 1;
  string text = 2;
  map<string, string> options = 3;
}

message CaptureRequest {
  string session_id = 1;
}

message CaptureResult {
  string image_path = 1;
}

message ToolRequest {
  string session_id = 1;
  string action = 2;
  string value = 3;
}

message ToolResult {
  string action = 1;
  string result = 2;
}
