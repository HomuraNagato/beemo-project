services:
  eve-reranker:
    privileged: true
    build:
      args:
        RUNTIME_IMAGE: "nvidia/cuda:12.9.1-cudnn-runtime-ubuntu24.04"
        ONNXRUNTIME_PACKAGE: "onnxruntime-linux-x64-gpu"
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      RERANKER_MODEL: "BAAI/bge-reranker-v2-m3-fp16"
      RERANKER_MODEL_PATH: "/models/reranker/bge-reranker-v2-m3-fp16/model_fp16.onnx"
      RERANKER_MODEL_URL: "https://huggingface.co/onnx-community/bge-reranker-v2-m3-ONNX/resolve/main/onnx/model_fp16.onnx"
      RERANKER_EXECUTION_PROVIDER: "cuda"
      RERANKER_DEVICE_ID: "0"
      RERANKER_BATCH_SIZE: "16"
      CUDA_VISIBLE_DEVICES: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
