domains:
  - id: time
    title: Time and date
    summary: Current and relative time and date handling.
    when_to_use:
      - Use for current time, date, weekday, month, and year requests.
      - Use for relative date requests such as tomorrow, yesterday, or a number of days from today.
    when_not_to_use:
      - Do not use for arithmetic or unit conversion requests.
    example_requests:
      - what time is it?
      - what date will it be five days from today?

  - id: calculator
    title: Calculator
    summary: Arithmetic, conversions, percentage calculations, and health calculations.
    when_to_use:
      - Use for math, percentage, conversion, BMI, BMR, and TDEE requests.
    when_not_to_use:
      - Do not use for time or date questions.
    example_requests:
      - what is 20% of 85?
      - convert 5 foot 4 to centimeters
      - what is my bmi?

  - id: weather
    title: Weather
    summary: Current and near-term weather for the configured location.
    when_to_use:
      - Use for today's weather, the current temperature, rain chances, tomorrow's weather, or this evening's forecast.
    when_not_to_use:
      - Do not use for current time or date questions.
    example_requests:
      - what is today's weather?
      - what is the temperature?
      - will it rain today?
      - what is the weather tomorrow?
      - what will the weather be this evening?

  - id: older_sister
    title: Older Sister
    summary: Delegate questions to ChatGPT with internet search when the local tools or local reasoning model are not enough.
    when_to_use:
      - Use for questions that require broad internet search, recent facts, current events, product information, documentation lookup, or external source checking.
      - Use when the user explicitly asks to ask ChatGPT, ask older sister, search the internet, look something up, or verify current information.
      - Use for expert knowledge, writing, editing, or explanation requests that are not covered by local time, weather, or calculator tools.
    when_not_to_use:
      - Do not use for local calculator, weather, or time/date questions that have dedicated tools.
      - Do not use for private local state unless the user explicitly wants external help with that content.
    example_requests:
      - ask older sister what changed in the latest openai api docs
      - search the internet for the latest vllm embedding support
      - can chatgpt look up whether this library still supports postgres 12?

  - id: beemo
    title: Beemo Direct
    summary: Answer directly with Beemo's local reasoning model when no specialized tool is needed.
    when_to_use:
      - Use for casual conversation, opinions, simple explanations, or local reasoning that does not need current facts, weather, time, math, conversion, or external search.
      - Use when the user is chatting with Beemo rather than asking for a dedicated tool.
    when_not_to_use:
      - Do not use for time, date, weather, calculator, conversion, BMI, BMR, TDEE, internet search, current facts, or external expert requests.
    example_requests:
      - tell me a short story
      - can you help me think through this idea?
      - how are you feeling today?

routes:
  - id: get_time.current_or_relative
    domain: time
    title: Current or relative date and time
    summary: Answer questions about the current time, date, day, month, year, or relative dates such as tomorrow, yesterday, or a number of days from today.
    when_to_use:
      - The user asks what time or date it is now.
      - The user asks for a relative day or date such as tomorrow, yesterday, next week, or five days from today.
      - A follow-up refers to a relative date or time and needs current date context.
    when_not_to_use:
      - The user asks for arithmetic or unit conversion.
      - The user wants a summary or general explanation rather than the current date or time.
    example_requests:
      - what time is it?
      - what day is tomorrow?
      - what date will it be five days from today?
      - what month is it right now?
    required_fields: []
    args_guidance: Use the get_time tool with empty args.
    default_args: {}
    handler:
      type: tool
      target: get_time

  - id: calculator.expression
    domain: calculator
    title: Arithmetic expression
    summary: Evaluate arithmetic expressions and straightforward math questions.
    when_to_use:
      - The user asks to calculate or evaluate a math expression.
      - The user asks basic arithmetic without needing a specialized calculator route.
    when_not_to_use:
      - The user asks for a percentage-specific operation with clear percent semantics.
      - The user asks for unit conversion, BMI, BMR, or TDEE.
    example_requests:
      - what is 12 divided by 4?
      - calculate 18 * (7 + 3)
      - what is 144 / 12?
    required_fields:
      - expression
    args_guidance: Set operation to expression and include a concrete arithmetic expression.
    default_args:
      operation: expression
    handler:
      type: tool
      target: calculator

  - id: weather.forecast
    domain: weather
    title: Current or near-term weather
    summary: Answer weather questions for the configured location, including current conditions, today's forecast, tomorrow's forecast, rain chances, and this evening's weather.
    when_to_use:
      - The user asks what the weather is today or tomorrow.
      - The user asks for the current temperature.
      - The user asks whether it will rain today.
      - The user asks what the weather will be this evening.
    when_not_to_use:
      - The user asks for the current time or date.
    example_requests:
      - what is today's weather?
      - what is the temperature?
      - will it rain today?
      - what is the weather tomorrow?
      - what will the weather be this evening?
    required_fields: []
    args_guidance: Use the weather tool. Args may be empty; the runtime will resolve whether the user means current weather, today, tomorrow, or this evening, and whether the focus is general weather, temperature, or rain.
    default_args: {}
    handler:
      type: tool
      target: weather

  - id: older_sister.search_or_advise
    domain: older_sister
    title: Ask Older Sister with web search
    summary: Ask ChatGPT for help, especially when the request benefits from internet search or current external information.
    when_to_use:
      - The user asks to call ChatGPT or older sister.
      - The user asks for internet search, current information, external documentation, news, product details, recommendations, or source-backed verification.
      - The user asks for expert knowledge, writing help, sentence improvement, editing, or explanation that is not covered by local tools.
      - The local model is likely to be weak because the answer depends on recent or web-only information.
    when_not_to_use:
      - The user asks for a supported local calculator, time, or weather operation.
      - The user asks a purely local project question that can be answered from the repo without internet.
    example_requests:
      - ask older sister to look up the latest OpenAI web search docs
      - search the internet for current vllm support for embedding models
      - ask chatgpt what the latest postgres docker image recommends for initialization
      - can older sister verify whether this error is common?
    required_fields:
      - query
    args_guidance: Use older_sister. Include the user's request as query. Set web_search to true for current information, external docs, recent facts, or explicit internet-search requests.
    default_args:
      web_search: true
    handler:
      type: tool
      target: older_sister

  - id: beemo.direct
    domain: beemo
    title: Direct local response
    summary: Answer directly with Beemo's local reasoning model without calling an external tool.
    when_to_use:
      - The user asks for casual conversation, a simple explanation, brainstorming, or local reasoning.
      - The request does not require current time, date, weather, calculations, conversions, BMI, BMR, TDEE, web search, or external expert knowledge.
    when_not_to_use:
      - The user asks for a dedicated local tool such as time, weather, or calculator.
      - The user asks for internet search, current external information, source-backed verification, or expert help better handled by older_sister.
    example_requests:
      - tell me a joke
      - help me brainstorm a name
      - say that in a softer way
    required_fields: []
    args_guidance: Choose beemo.direct with empty args when Beemo should answer directly.
    default_args: {}
    handler:
      type: tool
      target: beemo.direct

  - id: calculator.convert
    domain: calculator
    title: Unit conversion
    summary: Convert between units, including compound units such as speed, pace, and chemistry concentration.
    when_to_use:
      - The user asks to convert measurements from one unit to another.
      - The user asks for pace or speed conversion such as min/mi and mi/hr.
      - The user asks for chemistry-style rate conversions such as mg/ml to g/l.
    when_not_to_use:
      - The user explicitly asks for BMI, BMR, or TDEE.
      - The user asks for a pure arithmetic percentage question.
    example_requests:
      - convert 5 foot 4 to centimeters
      - what is 10 miles per hour in minutes per mile?
      - convert 5 mg/ml to g/l
    required_fields:
      - input_or_value
      - to_unit
    args_guidance: Set operation to convert. Use input arrays when multiple measurement parts are present, otherwise use value with from_unit and to_unit.
    default_args:
      operation: convert
    handler:
      type: tool
      target: calculator

  - id: calculator.bmi
    domain: calculator
    title: Body mass index
    summary: Calculate BMI from weight and height.
    when_to_use:
      - The user explicitly asks for BMI.
      - A follow-up asks for BMI using previously stated measurements.
    when_not_to_use:
      - The user asks for BMR or TDEE.
      - The user asks only for unit conversion.
    example_requests:
      - what is my bmi at 45kg and 64 inches?
      - calculate bmi for 101 pounds and 5 foot 4
      - what about bmi?
    required_fields:
      - weight
      - height
    args_guidance: Set operation to bmi. Include weight and height if present; omit missing fields rather than guessing.
    default_args:
      operation: bmi
    handler:
      type: tool
      target: calculator

  - id: calculator.bmr
    domain: calculator
    title: Basal metabolic rate
    summary: Calculate BMR from weight, height, age, and gender.
    when_to_use:
      - The user explicitly asks for BMR.
      - A follow-up asks for BMR using previously stated demographics or measurements.
    when_not_to_use:
      - The user asks for TDEE, which also needs activity level.
      - The user asks for BMI only.
    example_requests:
      - what is my bmr if i am 34, female, 45kg, and 64 inches?
      - calculate bmr
      - what about bmr?
    required_fields:
      - weight
      - height
      - age_years
      - gender
    args_guidance: Set operation to bmr. Carry forward explicit age, gender, weight, and height from the active thread when available.
    default_args:
      operation: bmr
    handler:
      type: tool
      target: calculator

  - id: calculator.tdee
    domain: calculator
    title: Total daily energy expenditure
    summary: Calculate TDEE from BMR inputs plus activity level.
    when_to_use:
      - The user explicitly asks for TDEE.
      - A follow-up asks for TDEE after sharing BMR-related measurements.
    when_not_to_use:
      - The user asks for BMR only.
      - The user asks for BMI or a unit conversion.
    example_requests:
      - what is my tdee if i am moderately active?
      - calculate tdee
      - what about tdee?
    required_fields:
      - weight
      - height
      - age_years
      - gender
      - activity_level
    args_guidance: Set operation to tdee. Reuse explicit BMR fields from the active thread and only omit fields that are still missing.
    default_args:
      operation: tdee
    handler:
      type: tool
      target: calculator

  - id: calculator.percent_of
    domain: calculator
    title: Percent of a value
    summary: Compute a percentage of a number, such as 20 percent of 85.
    when_to_use:
      - The user asks what a percentage of a value is.
    when_not_to_use:
      - The user asks how much a value changed by a percent.
      - The user asks what percentage one value is of another.
    example_requests:
      - what is 20% of 85?
      - what is 15 percent of 240?
    required_fields:
      - percent
      - value
    args_guidance: Set operation to percent_of with percent and value.
    default_args:
      operation: percent_of
    handler:
      type: tool
      target: calculator

  - id: calculator.percent_change
    domain: calculator
    title: Percent increase or decrease
    summary: Increase or decrease a value by a percentage.
    when_to_use:
      - The user asks to increase or decrease a value by some percent.
      - The user asks how much a number becomes after a percent change.
    when_not_to_use:
      - The user asks what percentage one value is of another.
      - The user asks for percent of a value without change direction.
    example_requests:
      - increase 85 by 12 percent
      - decrease 120 by 15%
    required_fields:
      - value
      - percent
      - direction
    args_guidance: Set operation to percent_change and include direction as increase or decrease.
    default_args:
      operation: percent_change
    handler:
      type: tool
      target: calculator

  - id: calculator.percent_ratio
    domain: calculator
    title: Percentage ratio
    summary: Determine what percentage one value is of another.
    when_to_use:
      - The user asks what percent one number is of another.
    when_not_to_use:
      - The user asks for a percent increase or decrease.
      - The user asks for a percent of a value.
    example_requests:
      - what percent is 18 of 24?
      - 30 is what percent of 50?
    required_fields:
      - part
      - whole
    args_guidance: Set operation to percent_ratio and include part and whole.
    default_args:
      operation: percent_ratio
    handler:
      type: tool
      target: calculator
